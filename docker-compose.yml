services:
  postgres:
    image: postgres:16
    container_name: streamcost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamcost}
      POSTGRES_USER: ${POSTGRES_USER:-streamcost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamcost}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - streamcost-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamcost} -d ${POSTGRES_DB:-streamcost}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:latest
    container_name: streamcost-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft cluster configuration (Single broker, no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Listeners: Host on 9092, Inter-container on 29092, KRaft Controller on 9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_DOCKER://streamcost-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      # Single-node development defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - streamcost-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  kafka-init:
    image: apache/kafka:latest
    container_name: streamcost-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - streamcost-network
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server streamcost-kafka:29092 --create --if-not-exists --topic cloud-cost-events --partitions 1 --replication-factor 1 &&
      echo 'Kafka topic cloud-cost-events created successfully' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server streamcost-kafka:29092 --describe --topic cloud-cost-events"
    restart: "no"

volumes:
  postgres_data:
    name: streamcost_postgres_data
  kafka_data:
    name: streamcost_kafka_data

networks:
  streamcost-network:
    name: streamcost-network
